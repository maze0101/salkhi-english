<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Салхи · Англи хэлний апп</title>
<script>
/* Алдаа гарвал дэлгэц дээр харуулна (цагаан дэлгэцээс сэргийлнэ) */
window.addEventListener("error",function(e){
  try{
    var box=document.getElementById("_errbox");
    if(!box){box=document.createElement("div");box.id="_errbox";box.style.cssText="position:fixed;left:0;right:0;top:0;z-index:99999;background:#b00020;color:#fff;font:13px/1.4 sans-serif;padding:10px 12px;white-space:pre-wrap;word-break:break-all";
      (document.body||document.documentElement).appendChild(box);}
    var f=(e.filename||"").split("/").pop();
    box.textContent+=(e.message||"Алдаа")+(f?" ["+f+":"+(e.lineno||0)+"]":"")+"\n";
  }catch(x){}
});
</script>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#132226">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@700&display=swap&subset=cyrillic,cyrillic-ext" rel="stylesheet">
<style>
/* Салхи — цэвэр минимал загвар: нэг өнгөний акцент, нимгэн хүрээ, сүүдэргүй. Бүх горимд ижил. */
:root{
  --bg:#F7F7F8; --surface:#FFFFFF; --ink:#111113; --ink-2:#6B6B74; --line:#E6E6EA;
  --sky:#2F5BEA; --dune:#D6E0FC; --dune-2:#EBF0FE; --dune-3:#2F5BEA;
  --neon:#2F5BEA; --neon-ink:#FFFFFF; --focus:#2F5BEA; --mesh:transparent;
  --ok:#15803D; --danger:#C81E1E; --shadow:none;
  --rc:14px; --sh-card:none; --soft:color-mix(in srgb,var(--sky) 8%,var(--surface));
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0B0D; --surface:#151518; --ink:#EDEDF0; --ink-2:#9B9BA5; --line:#26262B;
    --sky:#4A6CF7; --dune:#25305A; --dune-2:#1B2240; --dune-3:#7D97FF;
    --neon:#4A6CF7; --neon-ink:#FFFFFF; --focus:#7D97FF; --ok:#4ADE80; --danger:#F87171;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0B0D; --surface:#151518; --ink:#EDEDF0; --ink-2:#9B9BA5; --line:#26262B;
  --sky:#4A6CF7; --dune:#25305A; --dune-2:#1B2240; --dune-3:#7D97FF;
  --neon:#4A6CF7; --neon-ink:#FFFFFF; --focus:#7D97FF; --ok:#4ADE80; --danger:#F87171;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,textarea,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{max-width:600px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom))}

/* толгой хэсэг */
.hero{display:flex;flex-direction:column;gap:14px;padding:0 0 4px;color:var(--ink)}
/* hero анимаци (hero.js): цэгэн гарчиг, салхин тээрэм, цаасан шувуу; дарахад салхи үлээнэ */
.salkhi-hero{position:relative;width:100%;height:calc(290px + env(safe-area-inset-top));overflow:hidden;border-radius:0 0 28px 28px;background:#132226}
.salkhi-hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
.salkhi-hero__overlay{position:absolute;inset:0;pointer-events:none;padding:env(safe-area-inset-top,0px) 16px 0}
.salkhi-hero__overlay>*{pointer-events:auto}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.brand{position:absolute;top:calc(15px + env(safe-area-inset-top,0px));left:16px;display:flex;align-items:center;gap:8px;pointer-events:none}
.brand img{width:34px;height:34px;border-radius:9px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.brand b{font:700 15px/1 Unbounded,Inter,system-ui,sans-serif;color:#EAF4F1;letter-spacing:.04em}
@media (max-width:340px){.brand b{display:none}}
.tools{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;display:flex;align-items:center;gap:6px}
.themebtn{flex:none;height:36px;min-width:36px;padding:0 10px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#F4F8F7;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:4px;transition:background .15s,border-color .15s}
.themebtn:hover{background:rgba(255,255,255,.16)}
#ratebtn{font-size:13px;font-weight:600;white-space:nowrap}
.moderow{display:flex;align-items:center;gap:8px;padding:0 20px}
.modes{flex:1;min-width:0;display:flex;padding:3px;border-radius:12px;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.modes button{flex:1;padding:8px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap;transition:background .15s,color .15s}
.modes button[aria-pressed="true"]{background:var(--sky);color:#fff;box-shadow:0 1px 3px color-mix(in srgb,var(--sky) 45%,transparent)}
#forbtn{font-size:13px;font-weight:600;white-space:nowrap}
.kidq,.kfox{display:none!important}
@media (max-width:440px){#ratebtn .lbl,#forbtn .lbl{display:none}}
@media (max-width:350px){.modes button{font-size:12.5px;padding:7px 2px}}

/* хүүхдийн горимын жижиг үнэг (буланд) */
.kmini{position:fixed;right:max(14px,calc(50% - 286px));bottom:calc(84px + env(safe-area-inset-bottom));width:76px;height:64px;z-index:4;pointer-events:none;display:none}
:root[data-mode="kid"] .kmini{display:block}
.kmini .sm-m{width:76px;opacity:0;visibility:hidden;transform:translateY(40%);transition:transform .45s cubic-bezier(.3,1.4,.5,1),opacity .25s,visibility 0s .45s}
.kmini.on .sm-m{opacity:1;visibility:visible;transform:translateY(0);transition:transform .45s cubic-bezier(.3,1.4,.5,1),opacity .25s,visibility 0s}
.kmini svg{position:static;display:block;width:100%;height:auto;overflow:hidden}
.kmini .sm-crop{height:64px;overflow:hidden;border-radius:0 0 18px 18px}
.kmini .sm-say{position:absolute;right:88%;bottom:34px;white-space:nowrap;background:var(--ink);color:var(--bg);font:600 14px/1.2 var(--font);padding:7px 12px;border-radius:14px 14px 4px 14px;
  opacity:0;transform:scale(.6);transform-origin:100% 100%;transition:.2s ease-out}
.kmini .sm-say.show{opacity:1;transform:scale(1)}
.kmini .sm-m.jump .sm-critter{animation:sm-hop .8s cubic-bezier(.3,1.4,.5,1)}
.kmini .sm-critter{transform-origin:150px 260px;transform-box:view-box}
.kmini .sm-lid{transform-box:fill-box;transform-origin:center;animation:sm-blink 4s 1s infinite}
@keyframes sm-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes sm-hop{0%{transform:none}15%{transform:translateY(6px) scale(1.06,.92)}50%{transform:translateY(-40px) scale(.95,1.07)}80%{transform:translateY(4px) scale(1.05,.95)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.kmini .sm-m{transition:none}.kmini *{animation-duration:.01s!important;animation-iteration-count:1!important}}

/* статистикийн мөр */
.strip{display:flex;gap:6px;flex-wrap:nowrap;padding:14px 20px 0;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.stat{flex:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:var(--surface);border:1px solid var(--line);padding:6px 11px;border-radius:999px;font-weight:600;font-size:13px}
.stat b{font-weight:700;color:var(--ink);background:none;padding:0}
.stat.acct{font:inherit;font-size:13px;font-weight:600;color:inherit;cursor:pointer}
.stat.acct:disabled{opacity:.6;cursor:wait}

/* картын нийтлэг хөдөлгөөн */
.opt,.lrow,.scn,.gamecard,.chip,.btn,.lv{transition:background .15s ease,border-color .15s ease,transform .1s ease}
@media (hover:hover){.opt:not(:disabled):hover,.lrow:hover,.scn:not(:disabled):hover,.gamecard:hover{border-color:color-mix(in srgb,var(--ink) 22%,var(--line));background:color-mix(in srgb,var(--ink) 2%,var(--surface))}}
.opt:not(:disabled):active,.lrow:active,.scn:not(:disabled):active,.gamecard:active,.chip:active,.btn:active{transform:scale(.985)}
@media (prefers-reduced-motion:reduce){.opt,.lrow,.scn,.gamecard,.chip,.btn,.lv{transition:none}}

/* профайл */
.pf-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.pf-top{display:flex;align-items:center;gap:16px}
.pf-av{flex:none;width:64px;height:64px;border-radius:50%;background:var(--sky);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;overflow:hidden}
.pf-av img{width:100%;height:100%;object-fit:cover}
.pf-info{min-width:0}
.pf-name{font-size:19px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-mail{color:var(--ink-2);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pf-chips span{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.pf-sync{color:var(--ink-2);font-size:14px;margin:14px 0 0}

/* нэвтрэх хуудас */
.auth{position:fixed;inset:0;z-index:200;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.auth-in{position:relative;max-width:420px;margin:0 auto;padding:max(56px,env(safe-area-inset-top)) 24px 32px;min-height:100%;display:flex;flex-direction:column;justify-content:center}
.auth-x{position:absolute;top:max(14px,env(safe-area-inset-top));right:16px;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:16px}
.auth-logo{display:flex;align-items:center;gap:12px}
.auth-logo img{width:48px;height:48px;border-radius:12px}
.auth-logo span{font-size:30px;font-weight:700;letter-spacing:-.035em;color:var(--ink)}
.auth-sub{color:var(--ink-2);margin:12px 0 24px;font-size:15.5px;line-height:1.5}
.auth-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:3px;border-radius:12px;background:color-mix(in srgb,var(--ink) 8%,transparent);margin-bottom:18px}
.auth-seg button{border:0;background:none;padding:10px;border-radius:9px;font-weight:600;font-size:15px;color:var(--ink)}
.auth-seg button[aria-selected=true]{background:var(--sky);color:#fff;box-shadow:0 1px 3px color-mix(in srgb,var(--sky) 45%,transparent)}
.auth-form{display:flex;flex-direction:column}
.auth-l{color:var(--ink-2);font-size:14px;font-weight:500;margin:12px 0 6px}
.auth-f{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px}
.auth-f:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px color-mix(in srgb,var(--sky) 20%,transparent)}
.auth-pw{position:relative}
.auth-pw .auth-f{padding-right:54px}
.auth-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;color:var(--ink-2);display:flex;align-items:center;justify-content:center;border-radius:10px}
.auth-link{align-self:flex-start;border:0;background:none;padding:12px 0 0;color:var(--sky);font-size:14.5px;font-weight:500}
.auth-link:hover{text-decoration:underline}
.auth-link.center{align-self:center;margin-top:18px;padding:8px}
.auth-msg{margin:14px 0 0;color:var(--danger);font-size:14.5px}
.auth-msg.ok{color:var(--ok)}
.auth-main{margin-top:22px;padding:14px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;font-size:16px}
.auth-main:disabled,.auth-g:disabled{opacity:.5}
.auth-kid{margin:-10px 0 20px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px dashed var(--line);font-size:14.5px;line-height:1.5}
.auth-or{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--ink-2);font-size:13px}
.auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-g{display:flex;align-items:center;justify-content:center;gap:12px;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:16px}

/* хэл, түвшин */
.langs,.levels{display:flex;gap:6px;padding:12px 20px 0;overflow-x:auto;scrollbar-width:none}
.langs::-webkit-scrollbar,.levels::-webkit-scrollbar{display:none}
.levels{padding-top:8px}
.lv{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:13.5px;white-space:nowrap;background:var(--surface);color:var(--ink-2)}
.lv:hover{color:var(--ink)}
.lv[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding:20px 20px 0}
h2{font:700 24px/1.2 var(--font);letter-spacing:-.03em;margin-bottom:10px}
h3{letter-spacing:-.02em}
.muted{color:var(--ink-2)}
.small{font-size:14px}

/* доод цэс */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs .in{display:flex;gap:0;max-width:600px;margin:0 auto}
.tab{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 1px 4px;border:0;background:none;border-radius:10px;font-weight:500;font-size:10.5px;color:var(--ink-2);position:relative;transition:color .15s}
.tab .ti{display:flex;width:23px;height:23px}
.tab .ti svg{width:100%;height:100%;stroke-width:1.8}
.tab .tl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--sky);font-weight:600}
.tab[aria-current="page"] .ti svg{stroke-width:2.2}
@media (prefers-reduced-motion:reduce){.tab{transition:none}}

/* товчнууд */
.btn{padding:13px 18px;border-radius:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);text-align:center}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 22%,var(--line))}
.btn.primary{background:var(--sky);color:#fff;border-color:transparent}
.btn.primary:hover{background:color-mix(in srgb,var(--sky) 88%,#000)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:none}
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:8px 0 14px}
.ag button{padding:10px 2px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:600;line-height:1.1}
.ag button small{display:block;font-size:11px;font-weight:500;color:var(--ink-2);margin-top:3px}
.ag button[aria-pressed="true"]{border-color:var(--sky);background:var(--sky);color:#fff}
.ag button[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.abig{text-align:center;padding:16px}.abig .g{font-size:64px;font-weight:600;line-height:1.1}
.pad{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:20px 16px;gap:12px;overflow:auto}
.padbox{position:relative;width:min(80vw,340px);aspect-ratio:1;border:1px dashed var(--line);border-radius:16px;background:var(--surface);flex:none}
.padbox .gd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(46vw,200px);font-weight:600;opacity:.12;pointer-events:none;color:var(--ink);text-align:center;line-height:1}
.padbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hz{display:inline-block;text-align:center;margin:6px;vertical-align:top}
.hz>div{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.prow{padding:12px 0;border-bottom:1px solid var(--line)}
.prow .tg{font-size:20px;font-weight:700;margin:2px 0 6px}
.row{display:flex;gap:10px;margin-top:12px}
.row>*{flex:1}
.seg{display:inline-flex;border-radius:12px;padding:3px;background:color-mix(in srgb,var(--ink) 8%,transparent);margin-bottom:14px}
.seg button{padding:7px 14px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--sky);color:#fff;box-shadow:0 1px 3px color-mix(in srgb,var(--sky) 45%,transparent)}
.seg.lvseg{max-width:100%;overflow-x:auto}
.seg.segrid{display:grid;gap:3px;width:100%;border-radius:14px}
.seg.segrid button{padding:9px 4px;white-space:nowrap;text-align:center}
.seg.lvseg button{padding:7px 11px;flex:none}

/* үгийн карт */
.fc{position:relative;min-height:300px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 22px;overflow:hidden;width:100%;cursor:pointer;user-select:none}
.fc .mesh{display:none}
.fc>*:not(.mesh){position:relative}
.fc.pop{animation:pop .2s ease-out}
@keyframes pop{from{opacity:.6;transform:scale(.985)}to{opacity:1;transform:scale(1)}}
.en{font:700 clamp(30px,9vw,44px)/1.15 var(--font);letter-spacing:-.035em;overflow-wrap:anywhere}
.mn{font:600 clamp(22px,6.5vw,30px)/1.25 var(--font);letter-spacing:-.02em}
.ex{margin-top:16px;color:var(--ink-2);font-size:16.5px;max-width:32ch}
.hint{margin-top:18px;color:var(--ink-2);font-size:13.5px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--sky);border-radius:6px}

/* сонголтууд */
.q{font-size:19px;font-weight:600;margin:6px 0 2px;line-height:1.4;letter-spacing:-.015em}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:var(--rc);border:1px solid var(--line);background:var(--surface);font-weight:500;margin-top:8px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.opt.bad{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 9%,var(--surface))}
.fb{margin-top:12px;font-weight:600}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--danger)}

/* дүрэм, хичээлийн жагсаалт */
.hexb{flex:none;width:42px;height:42px;border-radius:12px;background:var(--soft);border:1px solid color-mix(in srgb,var(--sky) 18%,var(--line));display:grid;place-items:center;font:700 12px var(--font);color:var(--sky)}
.hexb.ico{font-size:21px}
.hexb.done{background:var(--sky);border-color:var(--sky);color:#fff}
.lvtag{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:6px;background:var(--soft);color:var(--sky);font:700 11px var(--font);vertical-align:middle}
.lrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;margin-top:8px;border:1px solid var(--line);border-radius:var(--rc);background:var(--surface);color:inherit}
.lrow .t{font-weight:600}
.rule{margin:14px 0;padding:14px 16px;border-left:3px solid var(--sky);background:var(--soft);font-weight:500;border-radius:0 10px 10px 0}
.exl{list-style:none;padding:0;margin-top:8px}
.exl li{padding:10px 0;border-bottom:1px solid var(--line)}
.tok{font:inherit;color:inherit;padding:0 1px;border:0;border-radius:4px;border-bottom:1px dotted color-mix(in srgb,var(--ink-2) 60%,transparent);cursor:pointer;text-align:inherit}
.tok:hover,.tok:focus-visible{background:color-mix(in srgb,var(--sky) 14%,transparent)}
.exl b{display:block;font-weight:600}
p+p{margin-top:10px}
.back{color:var(--ink-2);font-weight:600;font-size:14.5px;padding:4px 0;margin-bottom:8px}
.back:hover{color:var(--ink)}

/* яриа */

  if(state.lang!=="ru")t=t.replace(/[\u0400-\u04FF]+/g,"");

/* ---------- grammar ---------- */
function cleanSpeak(t){
  t=String(t).replace(/\s*\([^)]*\)/g,"").replace(/\s*（[^）]*）/g,"");
  if(state.lang==="zh")t=t.replace(/[A-Za-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]+/g,"");
  if(state.lang!=="ru")t=t.replace(/[\u0400-\u04FF]+/g,"");
  t=t.replace(/\s*(?:[→·/]|\.{3}|…)/g,",");
  return t.replace(/\s+/g," ").replace(/(,\s*)+/g,", ").replace(/^[,\s]+|[,\s]+$/g,"");
}
function speakSeq(list){speakList(list);}
function speakBtn(text,label){
  return h("button",{class:"btn ghost",style:"padding:6px 10px;flex:none","aria-label":label||"Сонсох",onclick:function(){speak(cleanSpeak(text));}},"🔊");
}
function fullSentence(q){
  if(q.say)return cleanSpeak(q.say);
  if(q.type==="order")return cleanSpeak(q.sentence);
  /* "Ээж: ___" гэх мэт монгол шошгыг авна (орос дуу монгол үгийг уншихгүй) */
  var t=q.q.replace(/^[^_:：]*[Ѐ-ӿ][^_:：]*[:：]\s*/,"");
  if(t.indexOf("___")>=0){
    t=t.replace(/_{3,}(\s*_{3,})+/g,"___");
    var gaps=t.split("___").length-1,parts=String(q.a).split(/\s*\/\s*|\s+/);
    if(gaps>1&&parts.length===gaps){var n=0;t=t.replace(/_{3,}/g,function(){return parts[n++];});}
    else t=t.replace(/_{3,}/,q.a).replace(/_{3,}/g,"");
    return cleanSpeak(t);
  }
  var m=t.match(/[「«]([^」»]+)[」»]/);
  if(m)return cleanSpeak(m[1]);
  if(state.lang==="zh"){m=t.match(/[\u4e00-\u9fff]+/);if(m)return m[0];}
  return "";
}
function norm(s){return String(s).toLowerCase().replace(/[.,!?]/g,"").replace(/\s+/g," ").trim();}
function qFrom(L,k,i){
  var ref={id:L.id,k:k,i:i};
  if(k==="q"){var q=L.q[i];return {type:"mc",q:q[0],o:shuffle(q[1]),a:q[1][q[2]],ref:ref};}
  if(k==="o"){
    var t=L.o[i],w=t.split(" "),sh=shuffle(w),n=0;
    while(sh.join(" ")===t&&n++<5)sh=shuffle(w);
    return {type:"order",words:sh,sentence:t,ref:ref};
  }
  var f=L.f[i];return {type:"type",q:f[0],a:f[1],ref:ref};
}
function buildQs(L){
  var qs=[];
  L.q.forEach(function(x,i){qs.push(qFrom(L,"q",i));});
  (L.o||[]).forEach(function(x,i){qs.push(qFrom(L,"o",i));});
  (L.f||[]).forEach(function(x,i){qs.push(qFrom(L,"f",i));});
  return qs;
}
function noteMiss(q,good){
  var r=q.ref;if(!r)return;
  var m=state.miss,idx=-1;
  for(var i=0;i<m.length;i++){if(m[i].id===r.id&&m[i].k===r.k&&m[i].i===r.i){idx=i;break;}}
  if(good&&idx>=0)m.splice(idx,1);
  else if(!good&&idx<0){m.push({id:r.id,k:r.k,i:r.i});if(m.length>80)m.shift();}
  sset("miss",m);
  ui.grammar.log.push({lv:q.lv||"",ok:!!good});
}

var transRec=null,transListening=false,transPaused=false;
function translateMN(text){
  text=(text||"").trim();
  if(!text)return;
  var pair={mn:text,en:"",pending:true,err:false};
  ui.translate.pairs.push(pair);
  paintTranslate();
  function finish(out,err){
    pair.pending=false;pair.err=!!err;pair.en=out||(err?"Орчуулж чадсангүй.":"—");
    paintTranslate();
    if(!err&&pair.en){pauseTransRec();speak(cleanAI(pair.en),function(){resumeTransRec();});}
  }
  var LN=LANG_EN[state.lang]||"English",romanize=["ja","ko","zh"].indexOf(state.lang)>=0;
  var prompt="Translate the following spoken Mongolian into natural, fluent "+LN+". "+
    "If it is already "+LN+", return it unchanged. "+
    (romanize?"After the "+LN+" translation, add its romanized reading in parentheses (romaji, romanization or pinyin). ":"")+
    "Output ONLY the "+LN+" translation"+(romanize?" (with romanization)":"")+", with no quotes, notes or explanations.\n\n"+text;
  sampleP.then(function(s){
    if(s)return s(prompt,{modelTier:"quick",cache:false}).then(function(r){return {text:(r&&r.text?r.text:"").trim()};});
    if(state.apiKey){
      var ctl=new AbortController();
      return callDirect([{role:"user",content:prompt}],{signal:ctl.signal,onText:function(){}},true);
    }
    if(freeOK()){
      var ctl2=new AbortController();
      return callFree([{role:"user",content:prompt}],{signal:ctl2.signal,onText:function(){}}).catch(function(e){
        if(e&&e.code==="cancelled")throw e;
        freeFail();throw {code:"no_ai"};
      });
    }
    return Promise.reject({code:"no_ai"});
  }).then(function(res){
    finish((res&&res.text||"").trim(),false);
  }).catch(function(e){
    var code=e&&e.code;
    finish(code==="no_ai"?"Орчуулгад AI хэрэгтэй. Дээрх зааврыг дагаж Claude нээх эсвэл түлхүүрээ оруулна уу.":errCopy(code),true);
  });
}
function pauseTransRec(){
  if(transListening&&!transPaused&&transRec){transPaused=true;try{transRec.stop();}catch(e){}}

function resumeTransRec(){

    if(transListening)setTimeout(function(){if(transListening&&!transPaused){try{transRec.start();}catch(e){}}},250);
  }
}
function stopTransRec(){

/* Микрофоны зөвшөөрлийг SpeechRecognition.start()-аас өмнө getUserMedia-аар асууна: зарим PWA/webview-д
   SpeechRecognition өөрөө зөвшөөрлийн цонхыг найдвартай гаргадаггүй тул хамгийн эрсдэлгүй зам */
function askMic(onOK,onFail){
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      try{stream.getTracks().forEach(function(t){t.stop();});}catch(e){}
      onOK();
    }).catch(function(){onFail();});
  }else onOK();
}

  var others=pickDistinct(G.pool,3,function(x){return x[2]!==w[2]&&x[1]!==w[1];}).map(function(x){return x[2];});
  G.q={w:w,o:shuffle([w[2]].concat(others)),picked:null};
}
function nextWordRound(G){
  var w=pickDistinct(G.pool,1,function(x){return !G.used[x[1]];})[0];G.used[w[1]]=1;
  G.w=w;G.picked=[];G.guessed=[];G.lives=6;G.solved=false;G.failed=false;
  if(G.kind==="scramble"){
    var ch=Array.from(w[1]),sh=shuffle(ch),n=0;
    while(sh.join("")===w[1]&&n++<8)sh=shuffle(ch);
    G.chars=sh;
  }
}

function startKidExam(){

  var hard=kidHard(),sp=ws.some(kxSpellable),types=hard?["ear","mean","rev","pair"]:["pic","ear","mean","yn","pair"];
  if(sp)types.push("spell");
  if(hard)types=types.concat(sp?["type","dict"]:["rev","ear"]);
  if(SR&&kxOpt.say)types.push("say");

  /* түвшин B1+: 15 асуулт, сонгосон түвшний зураггүй үгс (утга, монгол→гадаад, сонсох асуултад) */

    var sh=shuffle(pool),n=0;while(sh.slice(0,ch.length).join("")===ch.join("")&&n++<8)sh=shuffle(pool);q.ch=sh;q.built=[];
  }

  return "You are a kind "+LN+" writing teacher for a Mongolian learner at level "+LVDESC[lv==="all"?"b1":lv]+".\n"+
   "Task the learner was given: "+topic+"\n"+
   "Check the learner's text below. Reply in EXACTLY this format and nothing else:\n"+
   "SCORE: <0-10>\nCORRECTED:\n<the learner's full text rewritten in correct, natural "+LN+" with minimal changes; keep every sentence>\nMISTAKES:\n"+
   "- <wrong words copied from the learner's text> => <corrected words> :: <ONE code>\n"+
   "Never change numbers, names, places or facts the learner wrote; only fix grammar, spelling and word choice. The task text is in Mongolian — do not translate or comment on it.\n"+
   "Codes: "+Object.keys(ERRMN).join(", ")+".\n"+
   "(at most 5 of the most important mistakes; write '- none' if there are none)\n"+
   (state.lang==="ja"?"Writing a word in kana instead of kanji is NOT a mistake. Do not change kana to kanji.\n":"")+
   (state.lang==="zh"?"Do not add or require pinyin.\n":"")+
   "Do not use markdown and do not add any other text.\n\nLearner's text:\n"+text;
}
function parseWrite(t){

  var m=t.match(/SCORE:\s*(\d+(?:\.\d+)?)/i);if(m)r.score=Math.max(0,Math.min(10,Math.round(parseFloat(m[1]))));
  m=t.match(/CORRECTED:\s*([\s\S]*?)(?:\n\s*MISTAKES:|$)/i);if(m)r.corr=m[1].trim();
  m=t.match(/MISTAKES:\s*([\s\S]*?)(?:\n\s*TIP:|$)/i);

  if(m)m[1].split("\n").forEach(function(l){
    l=l.replace(/^[\s\-•*\d.)]+/,"").replace(/[\s\-]+$/,"").trim();if(!l||/^none\b/i.test(l))return;
    var a=l.split("::"),b=a[0].split(/=>|→|->/),code=String(a[1]||"").toUpperCase().replace(/[^A-Z_]/g,"");
    var bad=(b[0]||"").trim().replace(/^["«'“]|["»'”]$/g,""),good=(b[1]||"").trim().replace(/^["«'“]|["»'”]$/g,"");
    if(!bad&&!good||bad===good)return;

    r.mist.push({bad:bad,good:good,code:code});

  return r;
}

  for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--)d[i][j]=k(A[i])===k(B[j])?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);

  while(j<m){if(i<n&&k(A[i])===k(B[j])){out.push([B[j],false]);i++;j++;}else if(i<n&&d[i+1][j]>=d[i][j+1])i++;else{out.push([B[j],!/^\s+$/.test(B[j])]);j++;}}

}

    x.moveTo(a+u,s);x.lineTo(a+u,u);x.lineTo(a+3*u,u);x.moveTo(a+u,s);x.lineTo(a+s,s);
