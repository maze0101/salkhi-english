<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Салхи · Англи хэлний апп</title>
<script>
/* Алдаа гарвал дэлгэц дээр харуулна (цагаан дэлгэцээс сэргийлнэ) */
window.addEventListener("error",function(e){
  try{
    var box=document.getElementById("_errbox");
    if(!box){box=document.createElement("div");box.id="_errbox";box.style.cssText="position:fixed;left:0;right:0;top:0;z-index:99999;background:#b00020;color:#fff;font:13px/1.4 sans-serif;padding:10px 12px;white-space:pre-wrap;word-break:break-all";
      (document.body||document.documentElement).appendChild(box);}
    var f=(e.filename||"").split("/").pop();
    box.textContent+=(e.message||"Алдаа")+(f?" ["+f+":"+(e.lineno||0)+"]":"")+"\n";
  }catch(x){}
});
</script>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1F5F5B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Montserrat:wght@600;800&family=Unbounded:wght@500;700&display=swap&subset=cyrillic,cyrillic-ext" rel="stylesheet">
<style>
:root{
  --bg:#F3F0FF; --surface:#FFFFFF; --ink:#211B47; --ink-2:#645E8A; --line:#E2DDF6;
  --sky:#6C5CE7; --dune:#F9A8D4; --dune-2:#FDBA9B; --dune-3:#7C6CF2;
  --neon:#FFD23F; --neon-ink:#2B2200; --focus:#5B4BD6; --mesh:rgba(108,92,231,.14);
  --ok:#17935A; --danger:#D6443A; --shadow:0 6px 24px rgba(76,58,180,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15122B; --surface:#201C40; --ink:#F1EEFF; --ink-2:#A9A3D4; --line:#372F66;
    --sky:#5B4BD6; --dune:#B4568F; --dune-2:#C77B5E; --dune-3:#7C6CF2;
    --focus:#FFD23F; --mesh:rgba(255,255,255,.10); --ok:#4ADE9A; --danger:#FF8A80; --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#15122B; --surface:#201C40; --ink:#F1EEFF; --ink-2:#A9A3D4; --line:#372F66;
  --sky:#5B4BD6; --dune:#B4568F; --dune-2:#C77B5E; --dune-3:#7C6CF2;
  --focus:#FFD23F; --mesh:rgba(255,255,255,.10); --ok:#4ADE9A; --danger:#FF8A80; --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-bottom:110px}

/* hero */
.hero{position:relative;height:220px;background:linear-gradient(160deg,#5B4BD6 0%,#8B6CF0 55%,#F58FC0 120%);overflow:hidden;border-radius:0 0 36px 36px;color:#fff}
.hero svg g[fill]{fill:#fff}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .skytint{position:absolute;inset:0;pointer-events:none;transition:background 1s}
#sun{transition:cx 1s,cy 1s,fill 1s,r 1s}
#stars circle{fill:#fff;animation:twinkle 3.2s ease-in-out infinite}
#stars circle:nth-child(3n){animation-delay:.8s}
#stars circle:nth-child(3n+1){animation-delay:1.7s}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){#stars circle{animation:none}}
.hero .txt{position:absolute;left:20px;top:22px;right:20px}
.brand{font:700 36px/1 "Unbounded",system-ui,sans-serif;letter-spacing:-.02em}
.tag{margin-top:10px;color:rgba(255,255,255,.85);max-width:20ch;font-weight:500}
/* Салхи үнэг: хүүхдийн горимд hero дотор манхан дээрээс шагайна */
.kfox,.kidq{display:none}
:root[data-mode="kid"] .kfox{display:block}
:root[data-mode="kid"] .kidq{display:block}
:root[data-mode="kid"] .hero .tag:not(.kidq){display:none}
:root[data-mode="kid"] .hero .txt{pointer-events:none}
.kidq{font-weight:700;min-height:3.9em;max-width:14ch}
.kidq .sm-caret{display:inline-block;width:3px;height:.9em;background:#FFD83A;margin-left:2px;vertical-align:-.08em;animation:sm-car 1s steps(1) infinite}
.kfox{position:absolute;right:58px;bottom:16px;width:124px}
.kfox .sm-m{width:100%;transform:translateY(110%);animation:sm-peek 1s .8s cubic-bezier(.2,1.2,.4,1) forwards;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
.hero .kfox svg{position:static;display:block;width:100%;height:auto;overflow:visible}
.kfox .sm-m:focus-visible{outline:3px solid #FFD83A;outline-offset:4px;border-radius:12px}
.kfox .sm-critter{transform-origin:150px 260px;transform-box:view-box;animation:sm-idle 6s 1.9s ease-in-out infinite}
.kfox .sm-head{transform-origin:150px 150px;transform-box:view-box;animation:sm-tilt 6s 1.9s ease-in-out infinite}
.kfox .sm-ear{transform-box:fill-box;transform-origin:50% 100%;animation:sm-ear 3s 2.1s ease-in-out infinite}
.kfox .sm-ear.r{animation-delay:2.4s}
.kfox .sm-lid{transform-box:fill-box;transform-origin:center;animation:sm-blink 4s 2.2s infinite}
.kfox .sm-nose{transform-box:fill-box;transform-origin:center;animation:sm-sniff 1.8s 1.9s ease-in-out infinite}
.kfox .sm-tail{transform-origin:244px 262px;transform-box:view-box;animation:sm-tail 2.6s 1.9s ease-in-out infinite}
.kfox .sm-arm{transform-origin:216px 238px;transform-box:view-box;animation:sm-wave 1.4s 1.8s ease-in-out 2}
.kfox .sm-armL{transform-origin:86px 238px;transform-box:view-box}
.kfox .sm-m.jump .sm-critter{animation:sm-hop .8s cubic-bezier(.3,1.4,.5,1)}
.kfox .sm-m.jump .sm-arm{animation:sm-cheer .8s ease-in-out}
.kfox .sm-m.jump .sm-armL{animation:sm-cheerL .8s ease-in-out}
.kfox .sm-say{position:absolute;right:62%;bottom:72%;white-space:nowrap;background:#FFD83A;color:#1B1934;font:800 14px/1.2 Montserrat,system-ui,sans-serif;padding:7px 12px;border-radius:16px 16px 4px 16px;box-shadow:0 3px 0 rgba(0,0,0,.12);
  opacity:0;transform:scale(.5);transform-origin:100% 100%;transition:.25s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
.kfox .sm-say.show{opacity:1;transform:scale(1)}
@keyframes sm-car{50%{opacity:0}}
@keyframes sm-peek{to{transform:translateY(0)}}
@keyframes sm-tail{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
@keyframes sm-idle{0%,100%{transform:translateY(0)}20%{transform:translateY(-6px) scaleY(1.02)}40%{transform:translateY(0)}60%{transform:translateY(-3px)}80%{transform:translateY(2px) scaleY(.985)}}
@keyframes sm-tilt{0%,15%,100%{transform:rotate(0)}25%,40%{transform:rotate(-9deg)}55%,70%{transform:rotate(8deg)}80%{transform:rotate(0)}}
@keyframes sm-ear{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-14deg)}90%{transform:rotate(10deg)}}
@keyframes sm-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes sm-sniff{0%,60%,100%{transform:scale(1)}70%,90%{transform:scale(1.12,.9)}80%{transform:scale(.95,1.05)}}
@keyframes sm-wave{0%,100%{transform:rotate(0)}25%{transform:rotate(-20deg)}75%{transform:rotate(12deg)}}
@keyframes sm-hop{0%{transform:none}15%{transform:translateY(6px) scale(1.06,.92)}50%{transform:translateY(-40px) scale(.95,1.07)}80%{transform:translateY(4px) scale(1.05,.95)}100%{transform:none}}
@keyframes sm-cheer{50%{transform:rotate(-35deg)}}
@keyframes sm-cheerL{50%{transform:rotate(35deg)}}
@media (prefers-reduced-motion:reduce){.kfox *,.kidq *{animation-duration:.01s!important;animation-iteration-count:1!important}}
.kmini{position:fixed;right:max(14px,calc(50% - 266px));bottom:92px;width:76px;height:64px;z-index:4;pointer-events:none;display:none}
:root[data-mode="kid"] .kmini{display:block}
.kmini .sm-m{width:76px;opacity:0;visibility:hidden;transform:translateY(40%);transition:transform .45s cubic-bezier(.3,1.4,.5,1),opacity .25s,visibility 0s .45s}
.kmini.on .sm-m{opacity:1;visibility:visible;transform:translateY(0);transition:transform .45s cubic-bezier(.3,1.4,.5,1),opacity .25s,visibility 0s}
.hero .kmini svg,.kmini svg{position:static;display:block;width:100%;height:auto;overflow:hidden}
.kmini .sm-crop{height:64px;overflow:hidden;border-radius:0 0 18px 18px}
.kmini .sm-say{position:absolute;right:88%;bottom:34px;white-space:nowrap;background:#FFD83A;color:#1B1934;font:800 14px/1.2 Montserrat,system-ui,sans-serif;padding:7px 12px;border-radius:16px 16px 4px 16px;box-shadow:0 3px 0 rgba(0,0,0,.12);
  opacity:0;transform:scale(.5);transform-origin:100% 100%;transition:.25s cubic-bezier(.3,1.5,.5,1)}
.kmini .sm-say.show{opacity:1;transform:scale(1)}
.kmini .sm-m.jump .sm-critter{animation:sm-hop .8s cubic-bezier(.3,1.4,.5,1)}
.kmini .sm-critter{transform-origin:150px 260px;transform-box:view-box}
.kmini .sm-lid{transform-box:fill-box;transform-origin:center;animation:sm-blink 4s 1s infinite}
@media (prefers-reduced-motion:reduce){.kmini .sm-m{transition:none}.kmini *{animation-duration:.01s!important;animation-iteration-count:1!important}}
@media (max-width:360px){.kfox{right:50px;width:100px}:root[data-mode="kid"] .hero .kidq{font-size:15px;max-width:13ch}.kfox .sm-say{font-size:12px;padding:6px 10px;right:-8%;bottom:98%;border-radius:16px 16px 16px 4px;transform-origin:0 100%}}
.rotor{animation:spin 14s linear infinite}
.rotor.r2{animation-duration:20s}
@keyframes spin{to{transform:rotate(360deg)}}

.strip{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px;margin-top:-18px;position:relative}
.stat.acct{font:inherit;font-size:14px;font-weight:700;color:inherit;border:0;cursor:pointer}
.stat.acct:disabled{opacity:.7;cursor:wait}
.pf-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.pf-top{display:flex;align-items:center;gap:16px}
.pf-av{flex:none;width:68px;height:68px;border-radius:50%;background:var(--sky);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;overflow:hidden}
.pf-av img{width:100%;height:100%;object-fit:cover}
.pf-info{min-width:0}
.pf-name{font-size:20px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-mail{color:var(--ink-2);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pf-chips span{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.pf-sync{color:var(--ink-2);font-size:14px;margin:14px 0 0}
/* нэвтрэх хуудас */
.auth{position:fixed;inset:0;z-index:200;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.auth-in{position:relative;max-width:440px;margin:0 auto;padding:max(56px,env(safe-area-inset-top)) 24px 32px;min-height:100%;display:flex;flex-direction:column;justify-content:center}
.auth-x{position:absolute;top:max(14px,env(safe-area-inset-top));right:16px;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);color:var(--ink-2);font-size:18px;box-shadow:var(--shadow)}
.auth-logo{display:flex;align-items:center;gap:14px}
.auth-logo img{width:56px;height:56px;border-radius:16px;box-shadow:var(--shadow)}
.auth-logo span{font-size:34px;font-weight:800;letter-spacing:.02em;color:var(--sky)}
.auth-sub{color:var(--ink-2);margin:14px 0 24px;font-size:16px;line-height:1.45}
.auth-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:5px;border-radius:999px;background:var(--surface);border:1px solid var(--line);margin-bottom:18px}
.auth-seg button{border:0;background:none;padding:12px;border-radius:999px;font:inherit;font-weight:700;font-size:16px;color:var(--ink-2)}
.auth-seg button[aria-selected=true]{background:var(--sky);color:#fff}
.auth-form{display:flex;flex-direction:column}
.auth-l{color:var(--ink-2);font-size:15px;margin:12px 0 8px}
.auth-f{width:100%;padding:15px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:17px}
.auth-f:focus{outline:none;border-color:var(--sky)}
.auth-pw{position:relative}
.auth-pw .auth-f{padding-right:54px}
.auth-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;color:var(--ink-2);display:flex;align-items:center;justify-content:center;border-radius:12px}
.auth-link{align-self:flex-start;border:0;background:none;padding:12px 0 0;color:var(--sky);text-decoration:underline;font:inherit;font-size:15px}
.auth-link.center{align-self:center;margin-top:18px;padding:8px}
.auth-msg{margin:14px 0 0;color:var(--danger);font-size:15px}
.auth-msg.ok{color:var(--ok)}
.auth-main{margin-top:22px;padding:16px;border:0;border-radius:16px;background:var(--sky);color:#fff;font:inherit;font-weight:700;font-size:17px}
.auth-main:disabled,.auth-g:disabled{opacity:.6}
.auth-or{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--ink-2);font-size:14px}
.auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-g{display:flex;align-items:center;justify-content:center;gap:12px;padding:15px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:17px}
.stat{background:var(--surface);box-shadow:var(--shadow);padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px}
.stat b{background:var(--neon);color:var(--neon-ink);padding:0 7px;border-radius:999px;margin-right:6px}
.levels{display:flex;gap:6px;padding:12px 20px 4px;overflow-x:auto}
.lv{padding:8px 16px;border-radius:14px;border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap;background:var(--surface)}
.lv[aria-pressed="true"]{background:var(--sky);color:#fff;border-color:var(--sky)}
main{padding:14px 20px 0}
h2{font:700 22px/1.25 "Unbounded",system-ui,sans-serif;letter-spacing:-.01em;margin-bottom:8px}
.muted{color:var(--ink-2)}
.small{font-size:14px}

/* tabs */
.tabs{position:fixed;left:12px;right:12px;bottom:12px;background:var(--surface);border-radius:22px;box-shadow:0 8px 30px rgba(50,35,150,.22);z-index:5;max-width:536px;margin:0 auto}
.tabs .in{display:flex;max-width:560px;margin:0 auto}
.tab{flex:1 1 auto;padding:14px 3px 16px;font-weight:700;font-size:14px;color:var(--ink-2);position:relative}
.tab[aria-current="page"]{color:var(--sky)}
.tab[aria-current="page"]::before{content:"";position:absolute;bottom:7px;left:42%;right:42%;height:4px;background:var(--neon);border-radius:4px}

/* buttons */
.btn{padding:14px 18px;border-radius:18px;font-weight:700;border:1px solid var(--line);background:var(--surface);text-align:center}
.btn.primary{background:var(--neon);color:var(--neon-ink);border-color:transparent}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:none}
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:8px 0 14px}
.ag button{padding:10px 2px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:24px;font-weight:700;line-height:1.1;box-shadow:var(--shadow)}
.ag button small{display:block;font-size:11px;font-weight:600;color:var(--ink-2);margin-top:3px}
.ag button[aria-pressed="true"]{border-color:var(--sky);background:var(--neon);color:var(--neon-ink)}
.ag button[aria-pressed="true"] small{color:var(--neon-ink)}
.abig{text-align:center;padding:16px}.abig .g{font-size:64px;font-weight:700;line-height:1.1}
.tab{font-size:13px}
#ratebtn{left:62px;width:auto;padding:0 12px;border-radius:19px;font-size:13px;font-weight:700;white-space:nowrap}
.pad{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:20px 16px;gap:12px;overflow:auto}
.padbox{position:relative;width:min(80vw,340px);aspect-ratio:1;border:2px dashed var(--line);border-radius:18px;background:var(--surface);flex:none}
.padbox .gd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(46vw,200px);font-weight:700;opacity:.14;pointer-events:none;color:var(--ink);text-align:center;line-height:1}
.padbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hz{display:inline-block;text-align:center;margin:6px;vertical-align:top}
.hz>div{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.prow{padding:12px 0;border-bottom:1px solid var(--line)}
.prow .tg{font-size:20px;font-weight:700;margin:2px 0 6px}
.row{display:flex;gap:10px;margin-top:12px}
.row>*{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);margin-bottom:14px}
.seg button{padding:7px 16px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--sky);color:#fff}
.seg.lvseg{max-width:100%;overflow-x:auto}
.seg.lvseg button{padding:7px 11px;flex:none}

/* flashcard */
.fc{position:relative;min-height:300px;border-radius:32px;background:linear-gradient(160deg,var(--surface),color-mix(in srgb,var(--dune-3) 22%,var(--surface)));box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 22px;overflow:hidden;width:100%;cursor:pointer;user-select:none}
.fc .mesh{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fc>*:not(.mesh){position:relative}
.fc.pop{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.97)}to{transform:scale(1)}}
.en{font:700 clamp(30px,9vw,44px)/1.15 "Unbounded",system-ui,sans-serif;letter-spacing:-.02em;overflow-wrap:anywhere}
.mn{font:700 clamp(24px,7vw,32px)/1.25 "Manrope",system-ui,sans-serif}
.ex{margin-top:16px;color:var(--ink-2);font-size:17px;max-width:32ch}
.hint{margin-top:18px;color:var(--ink-2);font-size:14px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--dune));border-radius:8px}

/* options */
.q{font-size:20px;font-weight:700;margin:6px 0 2px;line-height:1.35}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:16px;box-shadow:var(--shadow);border:1.5px solid var(--line);background:var(--surface);font-weight:600;margin-top:10px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface))}
.opt.bad{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,var(--surface))}
.fb{margin-top:12px;font-weight:700}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--danger)}

/* grammar */
.hexb{flex:none;width:48px;height:48px;border-radius:16px;background:var(--dune-3);display:grid;place-items:center;font:700 12px "Unbounded",system-ui,sans-serif;color:#fff}
.hexb.done{background:var(--neon);color:var(--neon-ink)}
.lvtag{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;background:var(--dune-3);color:#fff;font:700 11px "Unbounded",system-ui,sans-serif;vertical-align:middle}
.lrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line)}
.lrow .t{font-weight:700}
.rule{margin:14px 0;padding:14px 16px;border-left:4px solid var(--sky);box-shadow:var(--shadow);background:var(--surface);font-weight:600;border-radius:0 12px 12px 0}
.exl{list-style:none;padding:0;margin-top:8px}
.exl li{padding:10px 0;border-bottom:1px solid var(--line)}
.tok{font:inherit;color:inherit;padding:0 1px;border:0;border-radius:4px;border-bottom:1.5px dotted color-mix(in srgb,var(--ink-2) 55%,transparent);cursor:pointer;text-align:inherit}
.tok:hover,.tok:focus-visible{background:color-mix(in srgb,var(--neon) 30%,transparent)}
.exl b{display:block}
p+p{margin-top:10px}
.back{color:var(--ink-2);font-weight:700;padding:4px 0;margin-bottom:8px}

/* chat */

/* stats */

<script>
/* Салхи үнэг — хүүхдийн горимын маскот. hero-д шагайж мэндэлнэ; hero харагдахгүй үед буланд жижиг үнэг гарна.
   Аппаас: salkhiMarmot.cheer(big) · salkhiMarmot.oops() · salkhiMarmot.tip(tab) · salkhiMarmot.say(text, hop). Бусад горимд бүгд зогсоно. */
(function(){
  var fox=document.getElementById("salkhiFox"),q=document.getElementById("kidq"),mini=document.getElementById("salkhiMini");if(!fox||!q||!mini)return;
  var QUESTIONS=["Өнөөдөр ямар шинэ зүйл сурч байна?","Өнөөдөр 5 үг давтах уу?","Сонсоод 3 үг зөв олж чадах уу?"];
  var GREETINGS=["Сайн уу! 👋","Hello! 🇬🇧","こんにちは! 🇯🇵","안녕! 🇰🇷","你好! 🇨🇳","Привет! 🇷🇺","Hallo! 🇩🇪"];
  var PRAISE=["Зөв! 🎉","Мундаг! ⭐","Ёстой гоё! 🌟","Сайн байна! 👏","Яг зөв! ✅"],BIG=["Гайхалтай! 🏆","Чи од шүү! 🌟","Ура! 🎉"];
  var OOPS=["Бараг л болсон! 💪","Дахиад оролдоё 🙂","Алдаа бол сурах арга! 🌱"];
  var TIPS={words:"Шинэ үгс сурцгаая! 📚",alpha:"Үсэг сурцгаая! ✏️",grammar:"Дүрэм бол тоглоом! 🧩",listen:"Чихээ сэртэл! 👂",chat:"Надтай ярилцаарай! 💬",play:"Тоглоом тоглоё! 🎮",stats:"Хараач, чи ахиж байна! 📈"};
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var wait=function(ms){return new Promise(function(r){setTimeout(r,ms);});};
  var kid=function(){return document.documentElement.getAttribute("data-mode")==="kid";};
  var whenKid=async function(){while(!kid())await wait(500);};
  var pick=function(a){return a[Math.floor(Math.random()*a.length)];};
  mini.querySelector(".sm-crop").append(fox.querySelector("svg").cloneNode(true));
  var hero=document.querySelector("header.hero"),heroOn=true,lastReact=0,g=0,caret="<span class=\"sm-caret\"></span>";
  var F={hero:{m:fox.querySelector(".sm-m"),b:fox.querySelector(".sm-say"),t:0},mini:{m:mini.querySelector(".sm-m"),b:mini.querySelector(".sm-say"),t:0}};
  function syncMini(){mini.classList.toggle("on",kid()&&!heroOn);}
  if("IntersectionObserver" in window&&hero)new IntersectionObserver(function(es){heroOn=es[0].isIntersecting;syncMini();},{threshold:.35}).observe(hero);
  new MutationObserver(syncMini).observe(document.documentElement,{attributes:true,attributeFilter:["data-mode"]});
  async function sayOn(f,text,hop){
    if(hop){f.m.classList.remove("jump");void f.m.offsetWidth;f.m.classList.add("jump");}
    clearTimeout(f.t);f.b.textContent="";f.b.classList.add("show");
    for(var ch of Array.from(text)){f.b.textContent+=ch;if(!reduce)await wait(35);}
    f.t=setTimeout(function(){f.b.classList.remove("show");f.m.classList.remove("jump");},2000);
  }
  function say(text,hop){if(!kid())return;syncMini();return sayOn(heroOn?F.hero:F.mini,text,hop);}
  function react(text,hop){lastReact=Date.now();return say(text,hop);}
  async function typeLoop(){
    await whenKid();await wait(700);var n=0;
    while(true){
      await whenKid();
      var t=QUESTIONS[n++%QUESTIONS.length];
      if(reduce){q.textContent=t;await wait(4500);continue;}
      for(var i=1;i<=t.length;i++){q.innerHTML=t.slice(0,i)+caret;await wait(55);}
      await wait(3200);
      for(var j=t.length;j>=0;j--){q.innerHTML=t.slice(0,j)+caret;await wait(22);}
      await wait(300);
    }
  }
  /* сул үед зөвхөн hero дахь үнэг мэндэлнэ; саяхан хариу үйлдэл хийсэн бол түр чимээгүй */
  async function talkLoop(){
    await whenKid();await wait(2800);
    while(true){await whenKid();if(heroOn&&Date.now()-lastReact>6000)await sayOn(F.hero,GREETINGS[g++%GREETINGS.length],g%2===0);await wait(3600);}
  }
  var tap=function(){react(GREETINGS[g++%GREETINGS.length],true);};
  F.hero.m.addEventListener("click",tap);
  F.hero.m.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();tap();}});
  addEventListener("pointermove",function(e){
    if(!kid())return;
    [[F.hero.m,fox],[F.mini.m,mini]].forEach(function(x){
      var r=x[0].getBoundingClientRect();if(!r.width)return;
      var dx=Math.max(-1,Math.min(1,(e.clientX-(r.left+r.width/2))/(r.width/2)));
      var dy=Math.max(-1,Math.min(1,(e.clientY-(r.top+r.height*.45))/(r.height/2)));
      x[1].querySelectorAll(".sm-p").forEach(function(p){p.setAttribute("cx",+p.dataset.x-3+dx*5);p.setAttribute("cy",+p.dataset.y+3+dy*5);});
    });
  });
  /* буруу хариултын хайрцаг (.fb.bad) гарахад урамшуулна */
  var lastOops=0;
  function watchMain(){var main=document.getElementById("main");if(main)new MutationObserver(function(ms){
    if(!kid()||Date.now()-lastOops<2500)return;
    for(var i=0;i<ms.length;i++)for(var k=0;k<ms[i].addedNodes.length;k++){var n=ms[i].addedNodes[k];
      if(n.nodeType===1&&((n.matches&&n.matches(".fb.bad"))||(n.querySelector&&n.querySelector(".fb.bad")))){lastOops=Date.now();react(pick(OOPS),false);return;}}
  }).observe(main,{childList:true,subtree:true});}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",watchMain);else watchMain();
  window.salkhiMarmot={
    say:say,
    cheer:function(big){react(big?pick(BIG):pick(PRAISE),true);},
    oops:function(){lastOops=Date.now();react(pick(OOPS),false);},
    tip:function(tab){if(TIPS[tab])react(TIPS[tab],false);}
  };
  syncMini();typeLoop();talkLoop();
})();
</script>

  VOICES.forEach(function(v){
    var vl=String(v.lang||"").replace("_","-");
    if(vl.split("-")[0].toLowerCase()!==base)return;
    var sc=0;
    if(vl.toLowerCase()===lang.toLowerCase())sc+=10;
    if(/natural|neural|online/i.test(v.name))sc+=8;
    if(/google/i.test(v.name))sc+=5;

    if(/microsoft|samantha|siri/i.test(v.name))sc+=2;
    if(v.localService===false)sc+=1;
    if(BADV.test(v.name))sc-=20;
    if(sc>bs){bs=sc;best=v;}
  });
  return best;

/* ---------- grammar ---------- */
function cleanSpeak(t){
  t=String(t).replace(/\s*\([^)]*\)/g,"").replace(/\s*（[^）]*）/g,"");
  if(state.lang==="zh")t=t.replace(/[A-Za-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]+/g,"");
  if(state.lang!=="ru")t=t.replace(/[\u0400-\u04FF]+/g,"");
  t=t.replace(/\s*(?:[→·/]|\.{3}|…)/g,",");
  return t.replace(/\s+/g," ").replace(/(,\s*)+/g,", ").replace(/^[,\s]+|[,\s]+$/g,"");
}
function speakSeq(list){speakList(list);}
function speakBtn(text,label){
  return h("button",{class:"btn ghost",style:"padding:6px 10px;flex:none","aria-label":label||"Сонсох",onclick:function(){speak(cleanSpeak(text));}},"🔊");
}
function fullSentence(q){
  if(q.type==="order")return cleanSpeak(q.sentence);
  /* "Ээж: ___" гэх мэт монгол шошгыг авна (орос дуу монгол үгийг уншихгүй) */
  var t=q.q.replace(/^[^_:：]*[Ѐ-ӿ][^_:：]*[:：]\s*/,"");
  if(t.indexOf("___")>=0){
    t=t.replace(/_{3,}(\s*_{3,})+/g,"___");
    var gaps=t.split("___").length-1,parts=String(q.a).split(/\s*\/\s*|\s+/);
    if(gaps>1&&parts.length===gaps){var n=0;t=t.replace(/_{3,}/g,function(){return parts[n++];});}
    else t=t.replace(/_{3,}/,q.a).replace(/_{3,}/g,"");
    return cleanSpeak(t);
  }
  var m=t.match(/[「«]([^」»]+)[」»]/);
  if(m)return cleanSpeak(m[1]);
  if(state.lang==="zh"){m=t.match(/[\u4e00-\u9fff]+/);if(m)return m[0];}
  return "";
}
function norm(s){return String(s).toLowerCase().replace(/[.,!?]/g,"").replace(/\s+/g," ").trim();}
function qFrom(L,k,i){
  var ref={id:L.id,k:k,i:i};
  if(k==="q"){var q=L.q[i];return {type:"mc",q:q[0],o:shuffle(q[1]),a:q[1][q[2]],ref:ref};}
  if(k==="o"){
    var t=L.o[i],w=t.split(" "),sh=shuffle(w),n=0;
    while(sh.join(" ")===t&&n++<5)sh=shuffle(w);
    return {type:"order",words:sh,sentence:t,ref:ref};
  }
  var f=L.f[i];return {type:"type",q:f[0],a:f[1],ref:ref};
}
function buildQs(L){
  var qs=[];
  L.q.forEach(function(x,i){qs.push(qFrom(L,"q",i));});
  (L.o||[]).forEach(function(x,i){qs.push(qFrom(L,"o",i));});
  (L.f||[]).forEach(function(x,i){qs.push(qFrom(L,"f",i));});
  return qs;
}
function noteMiss(q,good){
  var r=q.ref;if(!r)return;
  var m=state.miss,idx=-1;
  for(var i=0;i<m.length;i++){if(m[i].id===r.id&&m[i].k===r.k&&m[i].i===r.i){idx=i;break;}}
  if(good&&idx>=0)m.splice(idx,1);
  else if(!good&&idx<0){m.push({id:r.id,k:r.k,i:r.i});if(m.length>80)m.shift();}
  sset("miss",m);
  ui.grammar.log.push({lv:q.lv||"",ok:!!good});
}

function gameWords(){

  function fit(w){return w[1].length<=22&&w[2].length<=30;}
  var all=WORDS.filter(function(w){return (w[6]||"en")===L&&fit(w);});
  var ws=all.filter(function(w){
    if(kid&&KID_SET.indexOf(w[5])<0&&!kidLvOk(w[0]))return false;

  });
  return ws.length>=12?ws:all;
}
/* ижил утгатай хоёр үг нэг тоглоомд орохгүй */
function pickDistinct(ws,n,test){
  var out=[],seen={};
  shuffle(ws).some(function(w){
    if(test&&!test(w))return false;
    if(seen[w[2]]||seen[w[1]])return false;
    seen[w[2]]=seen[w[1]]=1;out.push(w);return out.length>=n;
  });
  return out;
}
function gameBest(k,v,lower){
  var b=state.games[k];

  return false;
}

function startGame(kind){
  var P=ui.play,ws=gameWords(),G={kind:kind,t0:Date.now(),done:false,miss:0,score:0};
  if(kind==="match"){
    var pick=pickDistinct(ws,6);
    if(pick.length<4){toast("Тоглоход үг хүрэлцэхгүй байна");return;}
    G.pairs=pick;G.left=shuffle(pick);G.right=shuffle(pick);G.sel=null;G.ok={};G.bad=null;
  }else if(kind==="speed"){
    G.pool=ws;G.end=Date.now()+60000;G.q=null;nextSpeed(G);
  }else if(kind==="dict"){
    G.round=0;G.rounds=5;G.pool=ws.filter(dictable);G.used={};G.sum=0;G.xp=0;
    if(G.pool.length<5){toast("Энэ түвшинд тохирох өгүүлбэр цөөн байна");return;}
    nextDict(G);
  }else if(kind==="scramble"||kind==="hang"){
    G.round=0;G.rounds=5;G.pool=ws.filter(kind==="hang"?hangable:scramblable);
    if(G.pool.length<5){toast("Энэ түвшинд тохирох үг цөөн байна");return;}
    G.used={};nextWordRound(G);
  }
  P.game=G;render();window.scrollTo(0,0);
}
function nextSpeed(G){
  var w=pickDistinct(G.pool,1,function(x){return !G.q||x[1]!==G.q.w[1];})[0];
  var others=pickDistinct(G.pool,3,function(x){return x[2]!==w[2]&&x[1]!==w[1];}).map(function(x){return x[2];});
  G.q={w:w,o:shuffle([w[2]].concat(others)),picked:null};
}
function nextWordRound(G){
  var w=pickDistinct(G.pool,1,function(x){return !G.used[x[1]];})[0];G.used[w[1]]=1;
  G.w=w;G.picked=[];G.guessed=[];G.lives=6;G.solved=false;G.failed=false;
  if(G.kind==="scramble"){
    var ch=Array.from(w[1]),sh=shuffle(ch),n=0;
    while(sh.join("")===w[1]&&n++<8)sh=shuffle(ch);
    G.chars=sh;
  }
}

   "Task the learner was given: "+topic+"\n"+
   "Check the learner's text below. Reply in EXACTLY this format and nothing else:\n"+
   "SCORE: <0-10>\nCORRECTED:\n<the learner's full text rewritten in correct, natural "+LN+" with minimal changes; keep every sentence>\nMISTAKES:\n"+
   "- <wrong words copied from the learner's text> => <corrected words> :: <ONE code>\n"+
   "Never change numbers, names, places or facts the learner wrote; only fix grammar, spelling and word choice. The task text is in Mongolian — do not translate or comment on it.\n"+
   "Codes: "+Object.keys(ERRMN).join(", ")+".\n"+

   (state.lang==="ja"?"Writing a word in kana instead of kanji is NOT a mistake. Do not change kana to kanji.\n":"")+

  m=t.match(/MISTAKES:\s*([\s\S]*?)(?:\n\s*TIP:|$)/i);

    var a=l.split("::"),b=a[0].split(/=>|→|->/),code=String(a[1]||"").toUpperCase().replace(/[^A-Z_]/g,"");
    var bad=(b[0]||"").trim().replace(/^["«'“]|["»'”]$/g,""),good=(b[1]||"").trim().replace(/^["«'“]|["»'”]$/g,"");

}

}

function skyLerp(a,b,t){return a+(b-a)*t;}
var SKYT=[[0,10,12,45,.5],[5,10,12,45,.5],[6.5,255,160,110,.26],[9,255,220,150,0],[16,255,200,120,0],[18,255,110,80,.30],[19.75,30,25,75,.42],[21,10,12,45,.5],[24,10,12,45,.5]];
function skyUpdate(now){
  try{
    now=now||new Date();
    var hr=now.getHours()+now.getMinutes()/60,sun=document.getElementById("sun"),glow=document.getElementById("sunglow"),stars=document.getElementById("stars"),tint=document.getElementById("skytint");
    if(!sun)return;
    var day=hr>=6&&hr<=19.5,t,x,y,c;
    if(day){
      t=(hr-6)/13.5;var k=Math.sin(Math.PI*t);
      x=250+t*130;y=122-84*k;
      c=[Math.round(skyLerp(255,255,k)),Math.round(skyLerp(120,226,k)),Math.round(skyLerp(70,102,k))];
      sun.setAttribute("fill","rgb("+c.join(",")+")");sun.setAttribute("opacity",".95");sun.setAttribute("r",String(Math.round(skyLerp(27,22,k))));
      glow.setAttribute("fill","rgb("+c.join(",")+")");glow.setAttribute("opacity",String(.12+.16*(1-k)));
      stars.setAttribute("opacity","0");
    }else{
      var h2=hr>=19.5?hr-19.5:hr+4.5;t=h2/10.5;var k2=Math.sin(Math.PI*t);
      x=250+t*130;y=124-78*k2;
      sun.setAttribute("fill","#F7F2DC");sun.setAttribute("opacity",".95");sun.setAttribute("r","19");
      glow.setAttribute("fill","#F7F2DC");glow.setAttribute("opacity",".14");
      stars.setAttribute("opacity",String(Math.min(1,Math.max(.35,k2+.4))));
    }
    sun.setAttribute("cx",x.toFixed(1));sun.setAttribute("cy",y.toFixed(1));
    glow.setAttribute("cx",x.toFixed(1));glow.setAttribute("cy",y.toFixed(1));
    var i=0;while(i<SKYT.length-2&&hr>SKYT[i+1][0])i++;
    var a=SKYT[i],b=SKYT[i+1],f=(hr-a[0])/(b[0]-a[0]);f=Math.min(1,Math.max(0,f));
    var col=[1,2,3].map(function(j){return Math.round(skyLerp(a[j],b[j],f));}),al=skyLerp(a[4],b[4],f);
    tint.style.background="linear-gradient(180deg,rgba("+col.join(",")+","+al.toFixed(2)+"),rgba("+col.join(",")+","+(al*0.55).toFixed(2)+"))";
    document.documentElement.setAttribute("data-tod",hr>=5&&hr<9?"dawn":hr>=9&&hr<17?"day":hr>=17&&hr<20?"dusk":"night");
  }catch(e){}
}
