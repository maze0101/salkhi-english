<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Салхи · Англи хэлний апп</title>
<script>
/* Алдаа гарвал дэлгэц дээр харуулна (цагаан дэлгэцээс сэргийлнэ) */
window.addEventListener("error",function(e){
  try{
    var box=document.getElementById("_errbox");
    if(!box){box=document.createElement("div");box.id="_errbox";box.style.cssText="position:fixed;left:0;right:0;top:0;z-index:99999;background:#b00020;color:#fff;font:13px/1.4 sans-serif;padding:10px 12px;white-space:pre-wrap;word-break:break-all";
      (document.body||document.documentElement).appendChild(box);}
    var f=(e.filename||"").split("/").pop();
    box.textContent+=(e.message||"Алдаа")+(f?" ["+f+":"+(e.lineno||0)+"]":"")+"\n";
  }catch(x){}
});
</script>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1F5F5B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap&subset=cyrillic,cyrillic-ext" rel="stylesheet">
<style>
:root{
  --bg:#F3F0FF; --surface:#FFFFFF; --ink:#211B47; --ink-2:#645E8A; --line:#E2DDF6;
  --sky:#6C5CE7; --dune:#F9A8D4; --dune-2:#FDBA9B; --dune-3:#7C6CF2;
  --neon:#FFD23F; --neon-ink:#2B2200; --focus:#5B4BD6; --mesh:rgba(108,92,231,.14);
  --ok:#17935A; --danger:#D6443A; --shadow:0 6px 24px rgba(76,58,180,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15122B; --surface:#201C40; --ink:#F1EEFF; --ink-2:#A9A3D4; --line:#372F66;
    --sky:#5B4BD6; --dune:#B4568F; --dune-2:#C77B5E; --dune-3:#7C6CF2;
    --focus:#FFD23F; --mesh:rgba(255,255,255,.10); --ok:#4ADE9A; --danger:#FF8A80; --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#15122B; --surface:#201C40; --ink:#F1EEFF; --ink-2:#A9A3D4; --line:#372F66;
  --sky:#5B4BD6; --dune:#B4568F; --dune-2:#C77B5E; --dune-3:#7C6CF2;
  --focus:#FFD23F; --mesh:rgba(255,255,255,.10); --ok:#4ADE9A; --danger:#FF8A80; --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-bottom:110px}

/* hero */
.hero{position:relative;height:220px;background:linear-gradient(160deg,#5B4BD6 0%,#8B6CF0 55%,#F58FC0 120%);overflow:hidden;border-radius:0 0 36px 36px;color:#fff}
.hero svg g[fill]{fill:#fff}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .skytint{position:absolute;inset:0;pointer-events:none;transition:background 1s}
#sun{transition:cx 1s,cy 1s,fill 1s,r 1s}
#stars circle{fill:#fff;animation:twinkle 3.2s ease-in-out infinite}
#stars circle:nth-child(3n){animation-delay:.8s}
#stars circle:nth-child(3n+1){animation-delay:1.7s}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){#stars circle{animation:none}}
.hero .txt{position:absolute;left:20px;top:22px;right:20px}
.brand{font:700 36px/1 "Unbounded",system-ui,sans-serif;letter-spacing:-.02em}
.tag{margin-top:10px;color:rgba(255,255,255,.85);max-width:20ch;font-weight:500}
.rotor{animation:spin 14s linear infinite}
.rotor.r2{animation-duration:20s}
@keyframes spin{to{transform:rotate(360deg)}}

.strip{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px;margin-top:-18px;position:relative}
.stat{background:var(--surface);box-shadow:var(--shadow);padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px}
.stat b{background:var(--neon);color:var(--neon-ink);padding:0 7px;border-radius:999px;margin-right:6px}
.levels{display:flex;gap:6px;padding:12px 20px 4px;overflow-x:auto}
.lv{padding:8px 16px;border-radius:14px;border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap;background:var(--surface)}
.lv[aria-pressed="true"]{background:var(--sky);color:#fff;border-color:var(--sky)}
main{padding:14px 20px 0}
h2{font:700 22px/1.25 "Unbounded",system-ui,sans-serif;letter-spacing:-.01em;margin-bottom:8px}
.muted{color:var(--ink-2)}
.small{font-size:14px}

/* tabs */
.tabs{position:fixed;left:12px;right:12px;bottom:12px;background:var(--surface);border-radius:22px;box-shadow:0 8px 30px rgba(50,35,150,.22);z-index:5;max-width:536px;margin:0 auto}
.tabs .in{display:flex;max-width:560px;margin:0 auto}
.tab{flex:1;padding:14px 4px 16px;font-weight:700;font-size:14px;color:var(--ink-2);position:relative}
.tab[aria-current="page"]{color:var(--sky)}
.tab[aria-current="page"]::before{content:"";position:absolute;bottom:7px;left:42%;right:42%;height:4px;background:var(--neon);border-radius:4px}

/* buttons */
.btn{padding:14px 18px;border-radius:18px;font-weight:700;border:1px solid var(--line);background:var(--surface);text-align:center}
.btn.primary{background:var(--neon);color:var(--neon-ink);border-color:transparent}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:none}
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:8px 0 14px}
.ag button{padding:10px 2px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:24px;font-weight:700;line-height:1.1;box-shadow:var(--shadow)}
.ag button small{display:block;font-size:11px;font-weight:600;color:var(--ink-2);margin-top:3px}
.ag button[aria-pressed="true"]{border-color:var(--sky);background:var(--neon);color:var(--neon-ink)}
.ag button[aria-pressed="true"] small{color:var(--neon-ink)}
.abig{text-align:center;padding:16px}.abig .g{font-size:64px;font-weight:700;line-height:1.1}
.tab{font-size:13px}
#ratebtn{left:62px;width:auto;padding:0 12px;border-radius:19px;font-size:13px;font-weight:700;white-space:nowrap}
.pad{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:20px 16px;gap:12px;overflow:auto}
.padbox{position:relative;width:min(80vw,340px);aspect-ratio:1;border:2px dashed var(--line);border-radius:18px;background:var(--surface);flex:none}
.padbox .gd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(46vw,200px);font-weight:700;opacity:.14;pointer-events:none;color:var(--ink);text-align:center;line-height:1}
.padbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hz{display:inline-block;text-align:center;margin:6px;vertical-align:top}
.hz>div{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.prow{padding:12px 0;border-bottom:1px solid var(--line)}
.prow .tg{font-size:20px;font-weight:700;margin:2px 0 6px}
.row{display:flex;gap:10px;margin-top:12px}
.row>*{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);margin-bottom:14px}
.seg button{padding:7px 16px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--sky);color:#fff}

/* flashcard */
.fc{position:relative;min-height:300px;border-radius:32px;background:linear-gradient(160deg,var(--surface),color-mix(in srgb,var(--dune-3) 22%,var(--surface)));box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 22px;overflow:hidden;width:100%;cursor:pointer;user-select:none}
.fc .mesh{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fc>*:not(.mesh){position:relative}
.fc.pop{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.97)}to{transform:scale(1)}}
.en{font:700 clamp(30px,9vw,44px)/1.15 "Unbounded",system-ui,sans-serif;letter-spacing:-.02em;overflow-wrap:anywhere}
.mn{font:700 clamp(24px,7vw,32px)/1.25 "Manrope",system-ui,sans-serif}
.ex{margin-top:16px;color:var(--ink-2);font-size:17px;max-width:32ch}
.hint{margin-top:18px;color:var(--ink-2);font-size:14px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--dune));border-radius:8px}

/* options */
.q{font-size:20px;font-weight:700;margin:6px 0 2px;line-height:1.35}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:16px;box-shadow:var(--shadow);border:1.5px solid var(--line);background:var(--surface);font-weight:600;margin-top:10px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface))}
.opt.bad{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,var(--surface))}
.fb{margin-top:12px;font-weight:700}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--danger)}

/* grammar */
.hexb{flex:none;width:48px;height:48px;border-radius:16px;background:var(--dune-3);display:grid;place-items:center;font:700 12px "Unbounded",system-ui,sans-serif;color:#fff}
.hexb.done{background:var(--neon);color:var(--neon-ink)}
.lrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line)}
.lrow .t{font-weight:700}
.rule{margin:14px 0;padding:14px 16px;border-left:4px solid var(--sky);box-shadow:var(--shadow);background:var(--surface);font-weight:600;border-radius:0 12px 12px 0}
.exl{list-style:none;padding:0;margin-top:8px}
.exl li{padding:10px 0;border-bottom:1px solid var(--line)}
.exl b{display:block}
p+p{margin-top:10px}
.back{color:var(--ink-2);font-weight:700;padding:4px 0;margin-bottom:8px}

/* chat */
.scn{display:block;width:100%;text-align:left;padding:16px;border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);background:var(--surface);font-weight:700;margin-top:10px}
.msgs{display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.b{max-width:88%;padding:11px 14px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.b.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.b.me{align-self:flex-end;background:var(--sky);color:#fff;border-bottom-right-radius:6px}
.fix{align-self:flex-end;max-width:88%;border-left:3px solid var(--neon);padding:4px 0 4px 12px;font-size:14px;color:var(--ink-2);white-space:pre-wrap}
.fix b{color:var(--ink)}
.spk{align-self:flex-start;font-size:13px;font-weight:700;color:var(--ink-2);padding:0 4px;margin-top:-6px}
.composer{position:sticky;bottom:80px;background:var(--bg);padding:10px 0 6px;display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:11px 14px;min-height:46px;max-height:120px}
.composer .btn{padding:12px 16px}
.rec{background:var(--danger);color:#fff;border-color:transparent}
.note{padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-top:12px;font-size:14px}

/* stats */
.big{font:700 40px/1 "Unbounded",system-ui,sans-serif;letter-spacing:-.03em}
.srow{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line)}
.days{display:flex;gap:8px;align-items:flex-end;height:110px;margin-top:10px}
.days div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--ink-2)}
.days i{display:block;width:100%;background:var(--sky);border-radius:6px 6px 0 0;min-height:4px;margin-bottom:6px}
.days i.z{background:var(--line)}

@media (prefers-reduced-motion: reduce){.rotor{animation:none}.fc.pop{animation:none}}

/* mode switch */
.modes{position:absolute;right:16px;top:16px;z-index:2;display:flex;background:rgba(255,255,255,.22);border-radius:999px;padding:3px;backdrop-filter:blur(6px)}
.modes button{padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;color:#fff}
.modes button[aria-pressed="true"]{background:#fff;color:#2B2A55}
.hero .txt{top:60px}

/* adult: calm, focused, sharper */
:root[data-mode="adult"]{--bg:#F4F5F2;--ink:#1B2422;--ink-2:#5A6662;--line:#DCE1DC;--sky:#1F5F5B;--dune:#8FC1B5;--dune-2:#B7D8CE;--dune-3:#2F7F79;--neon:#E9C46A;--neon-ink:#241B00;--focus:#1F5F5B;--shadow:0 2px 10px rgba(20,50,48,.10)}
:root[data-mode="adult"] .hero{background:linear-gradient(160deg,#173F3D,#1F5F5B 60%,#4E9C90 130%);border-radius:0 0 20px 20px}
:root[data-mode="adult"] .fc{border-radius:18px}
:root[data-mode="adult"] .btn,:root[data-mode="adult"] .opt,:root[data-mode="adult"] .scn{border-radius:12px}
:root[data-mode="adult"] .lv,:root[data-mode="adult"] .hexb{border-radius:10px}
:root[data-mode="adult"] .tabs{border-radius:14px}
:root[data-mode="adult"] .brand,:root[data-mode="adult"] h2,:root[data-mode="adult"] .en,:root[data-mode="adult"] .big{font-family:"Manrope",system-ui,sans-serif;font-weight:800;letter-spacing:-.02em}

/* kids: bright, chunky, bouncy */
:root[data-mode="kid"]{--bg:#FFF9E8;--ink:#2A2350;--ink-2:#6A6390;--line:#F0E3B8;--sky:#E5484D;--dune:#FFD93D;--dune-2:#6BCB77;--dune-3:#4D96FF;--neon:#6BCB77;--neon-ink:#0B2A10;--focus:#4D96FF;--shadow:0 5px 0 rgba(30,30,80,.14)}
:root[data-mode="kid"] body{font-size:18px}
:root[data-mode="kid"] .hero{background:linear-gradient(170deg,#4D96FF,#7CC4FF 65%,#FFF3B0 130%);border-radius:0 0 48px 48px}
:root[data-mode="kid"] .hero .tag{font-size:18px}
:root[data-mode="kid"] .fc{border-radius:40px;border:4px solid var(--dune);min-height:320px}
:root[data-mode="kid"] .en{font-size:clamp(36px,11vw,52px)}
:root[data-mode="kid"] .btn,:root[data-mode="kid"] .opt,:root[data-mode="kid"] .scn{border-radius:24px;border-width:3px;padding-top:16px;padding-bottom:16px;font-size:18px;transition:transform .12s}
:root[data-mode="kid"] .btn:active,:root[data-mode="kid"] .opt:active,:root[data-mode="kid"] .scn:active{transform:scale(.96)}
:root[data-mode="kid"] .btn.primary{color:#0B2A10;box-shadow:0 5px 0 #3E9B4B}
:root[data-mode="kid"] .lv{border-radius:20px;border-width:2px}
:root[data-mode="kid"] .hexb{border-radius:50%;background:var(--dune);color:#3A2E00}
:root[data-mode="kid"] .hexb.done{background:var(--dune-2)}
:root[data-mode="kid"] .tabs{border-radius:28px;border:3px solid var(--dune)}
:root[data-mode="kid"] .tab{font-size:16px}
:root[data-mode="kid"] .stat b{background:var(--dune);color:#3A2E00}
:root[data-mode="kid"] .bar{height:14px}
:root[data-mode="kid"] .b{font-size:18px;border-radius:24px}
@media (prefers-reduced-motion: reduce){.btn,.opt,.scn{transition:none!important}}

@media (prefers-color-scheme: dark){
:root[data-mode="adult"]:not([data-theme="light"]){--bg:#0E1716;--surface:#16231F;--ink:#E6F0EC;--ink-2:#9BB2AA;--line:#2A3D38;--sky:#2F7F79;--shadow:0 4px 16px rgba(0,0,0,.4)}
:root[data-mode="kid"]:not([data-theme="light"]){--bg:#1A1730;--surface:#26214A;--ink:#FFF6E0;--ink-2:#BDB6E6;--line:#3D3670;--sky:#E5484D;--shadow:0 5px 0 rgba(0,0,0,.35)}
}
:root[data-mode="adult"][data-theme="dark"]{--bg:#0E1716;--surface:#16231F;--ink:#E6F0EC;--ink-2:#9BB2AA;--line:#2A3D38;--sky:#2F7F79;--shadow:0 4px 16px rgba(0,0,0,.4)}
:root[data-mode="kid"][data-theme="dark"]{--bg:#1A1730;--surface:#26214A;--ink:#FFF6E0;--ink-2:#BDB6E6;--line:#3D3670;--sky:#E5484D;--shadow:0 5px 0 rgba(0,0,0,.35)}
:root[data-mode="kid"] .levels{display:none}
/* skins (өнгөний загварууд) */
:root[data-skin="ocean"]{--bg:#EEF6FB;--surface:#FFFFFF;--ink:#10263A;--ink-2:#4C6A82;--line:#D3E3EF;--sky:#1E6FB8;--dune:#7CC0E8;--dune-2:#B6DDF3;--dune-3:#2A86D0;--neon:#F4D35E;--neon-ink:#2B2200;--focus:#1E6FB8;--shadow:0 4px 16px rgba(20,70,120,.14)}
:root[data-skin="ocean"] .hero{background:linear-gradient(160deg,#0E3556,#1E6FB8 60%,#6BB6E6 130%)}
@media (prefers-color-scheme: dark){:root[data-skin="ocean"]:not([data-theme="light"]){--bg:#0B1722;--surface:#12263A;--ink:#E4F0F9;--ink-2:#9DB8CC;--line:#22405A;--sky:#2A78C2;--shadow:0 4px 16px rgba(0,0,0,.4)}}
:root[data-skin="ocean"][data-theme="dark"]{--bg:#0B1722;--surface:#12263A;--ink:#E4F0F9;--ink-2:#9DB8CC;--line:#22405A;--sky:#2A78C2;--shadow:0 4px 16px rgba(0,0,0,.4)}
:root[data-skin="sunrise"]{--bg:#FFF6EE;--surface:#FFFFFF;--ink:#3A2118;--ink-2:#7A5A4C;--line:#F0D9C9;--sky:#C8481F;--dune:#F6B26B;--dune-2:#FAD7A0;--dune-3:#E07A3F;--neon:#FFD166;--neon-ink:#2B1B00;--focus:#C8481F;--shadow:0 4px 16px rgba(150,70,20,.14)}
:root[data-skin="sunrise"] .hero{background:linear-gradient(160deg,#7A2E12,#C8481F 60%,#F6B26B 130%)}
@media (prefers-color-scheme: dark){:root[data-skin="sunrise"]:not([data-theme="light"]){--bg:#1D120D;--surface:#2A1A13;--ink:#FBEBDD;--ink-2:#D3B29E;--line:#4A2F22;--sky:#C4471F;--shadow:0 4px 16px rgba(0,0,0,.4)}}
:root[data-skin="sunrise"][data-theme="dark"]{--bg:#1D120D;--surface:#2A1A13;--ink:#FBEBDD;--ink-2:#D3B29E;--line:#4A2F22;--sky:#C4471F;--shadow:0 4px 16px rgba(0,0,0,.4)}
:root[data-skin="sakura"]{--bg:#FFF1F5;--surface:#FFFFFF;--ink:#3A1524;--ink-2:#84586A;--line:#F5D3DF;--sky:#C2417A;--dune:#F4A6C0;--dune-2:#FBCFDD;--dune-3:#D96A98;--neon:#FFD98A;--neon-ink:#2B1B00;--focus:#C2417A;--shadow:0 4px 16px rgba(150,40,90,.13)}
:root[data-skin="sakura"] .hero{background:linear-gradient(160deg,#5E1A3B,#C2417A 60%,#F4A6C0 130%)}
@media (prefers-color-scheme: dark){:root[data-skin="sakura"]:not([data-theme="light"]){--bg:#1E0E15;--surface:#2D1621;--ink:#FCE8EF;--ink-2:#D2A5B8;--line:#4E2637;--sky:#B93A72;--shadow:0 4px 16px rgba(0,0,0,.4)}}
:root[data-skin="sakura"][data-theme="dark"]{--bg:#1E0E15;--surface:#2D1621;--ink:#FCE8EF;--ink-2:#D2A5B8;--line:#4E2637;--sky:#B93A72;--shadow:0 4px 16px rgba(0,0,0,.4)}
:root[data-skin="violet"]{--bg:#F3F0FF;--surface:#FFFFFF;--ink:#211B47;--ink-2:#645E8A;--line:#E2DDF6;--sky:#6C5CE7;--dune:#F9A8D4;--dune-2:#FDBA9B;--dune-3:#7C6CF2;--neon:#FFD23F;--neon-ink:#2B2200;--focus:#5B4BD6;--shadow:0 6px 24px rgba(76,58,180,.12)}
:root[data-skin="violet"] .hero{background:linear-gradient(160deg,#2E2470,#6C5CE7 60%,#F9A8D4 130%)}
@media (prefers-color-scheme: dark){:root[data-skin="violet"]:not([data-theme="light"]){--bg:#14112B;--surface:#1E1A3D;--ink:#ECE8FF;--ink-2:#B3ACE0;--line:#34305F;--sky:#6555E0;--shadow:0 4px 16px rgba(0,0,0,.4)}}

    if(/microsoft|samantha|siri/i.test(v.name))sc+=2;

/* pronunciation */
function lev(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  for(i=0;i<=m;i++)d[i]=[i];
  for(j=1;j<=n;j++)d[0][j]=j;
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
  return d[m][n];
}
function nz(t){return norm(cleanSpeak(String(t))).replace(/[\s。、，！？…\.]+/g,"");}
function speechOk(alts,target){
  var t=nz(target);if(!t)return false;
  return alts.some(function(a){
    a=nz(a);if(!a)return false;
    if(a===t||a.indexOf(t)>=0)return true;
    return t.length>=4&&1-lev(a,t)/Math.max(a.length,t.length)>=0.8;
  });
}
function speechScore(alts,target){
  var t=nz(target),best=0;if(!t)return 0;
  alts.forEach(function(a){
    a=nz(a);if(!a)return;
    var sc=(a===t||a.indexOf(t)>=0)?1:Math.max(0,1-lev(a,t)/Math.max(a.length,t.length));
    if(sc>best)best=sc;
  });
  return Math.round(best*100);
}
function noteSpeech(sc){
  state.speech.n++;state.speech.sum+=sc;
  var k=dkey(new Date());state.speech.last=k;

function checkSpeech(target,st,xp){
  try{
    var rec=new SR();rec.lang=LANG_TTS[state.lang]||"en-US";rec.maxAlternatives=5;rec.interimResults=false;
    st.className="fb";st.textContent="Сонсож байна... хэлээрэй";
    rec.onresult=function(e){
      var alts=[];for(var i=0;i<e.results[0].length;i++)alts.push(e.results[0][i].transcript);
      var sc=speechScore(alts,target);noteSpeech(sc);
      if(speechOk(alts,target)){st.className="fb ok";st.textContent="Зөв дуудлаа! Оноо "+sc+"% · +"+xp+" XP";addXP(xp);addStar();celebrate();}
      else{st.className="fb bad";st.textContent="Танигдсан: «"+alts[0]+"». Оноо "+sc+"%. Дахин оролдоорой.";}
    };
    rec.onerror=function(){st.className="fb bad";st.textContent="Микрофон ажиллахгүй байна. Зөвшөөрлөө шалгана уу.";};
    rec.start();
  }catch(e){st.textContent="Микрофон ажиллахгүй байна.";}
}

function importData(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var o=JSON.parse(fr.result);
      if(!isObj(o)||o.app!=="salkhi")throw new Error("bad");
      if(typeof confirm==="function"&&!confirm("Одоогийн явцыг файлын явцаар солих уу?"))return;
      var num={xp:1,chat:1,stars:1,listenOk:1,goal:1,freeze:1,frzMark:1,rate:1,fz:1},obj={box:1,due:1,daily:1,lessons:1,tasks:1,frozen:1,langxp:1,stories:1,speech:1,exam:1};
      STORE_KEYS.forEach(function(k){
        var key=k[0],v=o[key];if(v===undefined)return;
        if(num[key]){if(typeof v!=="number"||!isFinite(v)||v<0)return;}
        else if(obj[key]){if(!isObj(v))return;}
        else if(key==="miss"){if(!Array.isArray(v))return;}
        else if(key==="saved"){if(!Array.isArray(v)||v.some(function(x){return typeof x!=="string";}))return;}
        else if(key==="custom"){if(!Array.isArray(v)||v.some(function(c){return !Array.isArray(c)||c.length<6||typeof c[1]!=="string"||typeof c[2]!=="string";}))return;}
        else if(key==="level"){if(["all","a1","b1","b2"].indexOf(v)<0)return;}
        else if(key==="mode"){if(["adult","senior","kid"].indexOf(v)<0)return;}
        else if(key==="skin"){if(!SKIN_SKY[v])return;}
        else if(key==="lang"){if(["en","ja","ko","zh","ru","de"].indexOf(v)<0)return;}
        else if(key==="theme"){if(THEMES.indexOf(v)<0)return;}
        sset(key,v);
      });
      toast("Явц сэргээгдлээ");setTimeout(function(){location.reload();},700);
    }catch(e){toast("Энэ файл Салхи аппын явц биш байна");}
  };
  fr.readAsText(file);
}
function b64e(bytes){var t="";for(var i=0;i<bytes.length;i++)t+=String.fromCharCode(bytes[i]);return btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function b64d(t){t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";var b=atob(t),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function pipeBytes(bytes,ts){return new Response(new Blob([bytes]).stream().pipeThrough(ts)).arrayBuffer().then(function(b){return new Uint8Array(b);});}
function makeCode(){
  var o={app:"salkhi",v:1};STORE_KEYS.forEach(function(k){o[k[0]]=state[k[1]];});
  var raw=new TextEncoder().encode(JSON.stringify(o));
  if(typeof CompressionStream==="function")return pipeBytes(raw,new CompressionStream("gzip")).then(function(z){return "S1."+b64e(z);});
  return Promise.resolve("S0."+b64e(raw));
}
function readCode(code){
  code=String(code).trim();
  var p=code.slice(0,3),bytes;
  try{bytes=b64d(code.slice(3));}catch(e){return Promise.reject(e);}
  if(p==="S1."&&typeof DecompressionStream==="function")return pipeBytes(bytes,new DecompressionStream("gzip")).then(function(r){return new TextDecoder().decode(r);});
  if(p==="S0.")return Promise.resolve(new TextDecoder().decode(bytes));
  return Promise.reject(new Error("bad"));
}

function cleanSpeak(t){
  t=String(t).replace(/\s*\([^)]*\)/g,"").replace(/\s*（[^）]*）/g,"");
  if(state.lang==="zh")t=t.replace(/[A-Za-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]+/g,"");
  if(state.lang!=="ru")t=t.replace(/[\u0400-\u04FF]+/g,"");
  t=t.replace(/[→·]/g,",");
  return t.replace(/\s+/g," ").replace(/(,\s*)+/g,", ").replace(/^[,\s]+|[,\s]+$/g,"");
}
function speakSeq(list){speakList(list);}
function speakBtn(text,label){
  return h("button",{class:"btn ghost",style:"padding:6px 10px;flex:none","aria-label":label||"Сонсох",onclick:function(){speak(cleanSpeak(text));}},"🔊");
}
function fullSentence(q){
  if(q.type==="order")return cleanSpeak(q.sentence);
  var t=q.q;
  if(t.indexOf("___")>=0)return cleanSpeak(t.replace("___",q.a));
  var m=t.match(/[「«]([^」»]+)[」»]/);
  if(m)return cleanSpeak(m[1]);
  if(state.lang==="zh"){m=t.match(/[\u4e00-\u9fff]+/);if(m)return m[0];}
  return "";
}
function norm(s){return String(s).toLowerCase().replace(/[.,!?]/g,"").replace(/\s+/g," ").trim();}
function qFrom(L,k,i){
  var ref={id:L.id,k:k,i:i};
  if(k==="q"){var q=L.q[i];return {type:"mc",q:q[0],o:shuffle(q[1]),a:q[1][q[2]],ref:ref};}
  if(k==="o"){
    var t=L.o[i],w=t.split(" "),sh=shuffle(w),n=0;
    while(sh.join(" ")===t&&n++<5)sh=shuffle(w);
    return {type:"order",words:sh,sentence:t,ref:ref};
  }
  var f=L.f[i];return {type:"type",q:f[0],a:f[1],ref:ref};
}
function buildQs(L){
  var qs=[];
  L.q.forEach(function(x,i){qs.push(qFrom(L,"q",i));});
  (L.o||[]).forEach(function(x,i){qs.push(qFrom(L,"o",i));});
  (L.f||[]).forEach(function(x,i){qs.push(qFrom(L,"f",i));});
  return qs;
}
function noteMiss(q,good){
  var r=q.ref;if(!r)return;
  var m=state.miss,idx=-1;
  for(var i=0;i<m.length;i++){if(m[i].id===r.id&&m[i].k===r.k&&m[i].i===r.i){idx=i;break;}}
  if(good&&idx>=0)m.splice(idx,1);
  else if(!good&&idx<0){m.push({id:r.id,k:r.k,i:r.i});if(m.length>80)m.shift();}
  sset("miss",m);
  ui.grammar.log.push({lv:q.lv||"",ok:!!good});
}

var transRec=null,transListening=false,transPaused=false;
function translateMN(text){
  text=(text||"").trim();
  if(!text)return;
  var pair={mn:text,en:"",pending:true,err:false};
  ui.translate.pairs.push(pair);
  paintTranslate();
  function finish(out,err){
    pair.pending=false;pair.err=!!err;pair.en=out||(err?"Орчуулж чадсангүй.":"—");
    paintTranslate();
    if(!err&&pair.en){pauseTransRec();speakEnglish(pair.en,function(){resumeTransRec();});}
  }
  var prompt="Translate the following spoken Mongolian into natural, fluent English. "+
    "If it is already English, return it unchanged. "+
    "Output ONLY the English translation, with no quotes, notes or explanations.\n\n"+text;
  sampleP.then(function(s){
    if(s)return s(prompt,{modelTier:"quick",cache:false}).then(function(r){return {text:(r&&r.text?r.text:"").trim()};});
    if(state.apiKey){
      var ctl=new AbortController();
      return callDirect([{role:"user",content:prompt}],{signal:ctl.signal,onText:function(){}},true);
    }
    if(freeAI()){
      var ctl2=new AbortController();
      return callFree([{role:"user",content:prompt}],{signal:ctl2.signal,onText:function(){}}).catch(function(e){
        if(e&&e.code==="cancelled")throw e;
        freeFail();throw {code:"no_ai"};
      });
    }
    return Promise.reject({code:"no_ai"});
  }).then(function(res){
    finish((res&&res.text||"").trim(),false);
  }).catch(function(e){
    var code=e&&e.code;
    finish(code==="no_ai"?"Орчуулгад AI хэрэгтэй. Дээрх зааврыг дагаж Claude нээх эсвэл түлхүүрээ оруулна уу.":errCopy(code),true);
  });
}
function pauseTransRec(){
  if(transListening&&!transPaused&&transRec){transPaused=true;try{transRec.stop();}catch(e){}}
}
function resumeTransRec(){
  if(transPaused){
    transPaused=false;
    if(transListening)setTimeout(function(){if(transListening&&!transPaused){try{transRec.start();}catch(e){}}},250);
  }
}
function stopTransRec(){
  transListening=false;transPaused=false;
  try{transRec&&transRec.stop();}catch(e){}
  ui.translate.live="";
  var btn=document.getElementById("trmic");
  if(btn){btn.classList.remove("rec");btn.textContent="🎙️ Ярих";}
}
function toggleTransRec(btn){
  if(transListening){stopTransRec();return;}
  if(!SR)return;
  transRec=new SR();
  transRec.lang="mn-MN";transRec.continuous=true;transRec.interimResults=true;
  transRec.onresult=function(e){
    var interim="";
    for(var i=e.resultIndex;i<e.results.length;i++){
      var r=e.results[i];
      if(r.isFinal)translateMN(r[0].transcript);
      else interim+=r[0].transcript;
    }
    ui.translate.live=interim;paintTranslate();
  };
  transRec.onerror=function(e){
    if(e.error==="no-speech"||e.error==="aborted")return;
    stopTransRec();
    toast(e.error==="not-allowed"?"Микрофоны зөвшөөрөл хэрэгтэй.":"Дуу таних алдаа гарлаа.");
  };
  transRec.onend=function(){
    if(transListening&&!transPaused){try{transRec.start();}catch(e){stopTransRec();}}
  };
  try{
    transRec.start();transListening=true;
    btn.classList.add("rec");btn.textContent="⏹️ Зогсоох";
  }catch(e){transListening=false;}
}
