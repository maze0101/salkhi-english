name = "salkhi-ai"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

[ai]
binding = "AI"

[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# /tts: нэг яриа 10+ өгүүлбэртэй байж болох тул чатынхаас сул хязгаар
[[ratelimits]]
name = "TTS_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 120
  period = 60

# ✨ HD дуу (ElevenLabs): үүсгэсэн дууг энд үүрд хадгална + өдрийн тэмдэгтийн тоолуур.
# Түлхүүрийг: npx wrangler secret put ELEVENLABS_API_KEY  (хүсвэл ELEVENLABS_VOICE, ELEVENLABS_MODEL, ELEVENLABS_DAILY_CHARS)
[[kv_namespaces]]
binding = "TTS_KV"
id = "27ce0c26168b4742916441db21f042bf"
