<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn Mongolian · Salkhi</title>
<meta name="description" content="Learn Mongolian: Cyrillic alphabet with audio, everyday phrases, 700+ words and quizzes.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1F5F5B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap&subset=cyrillic,cyrillic-ext" rel="stylesheet">
<style>
:root{--bg:#F4F5F2;--surface:#fff;--ink:#1D2320;--ink-2:#5F6B66;--line:#E1E5E0;--brand:#1F5F5B;--brand-ink:#fff;--accent:#E9C46A;--ok:#2A8C5A;--bad:#C0392B;--shadow:0 2px 10px rgba(20,40,35,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101614;--surface:#18201D;--ink:#E8EEEB;--ink-2:#9AA8A2;--line:#2A3531;--brand:#5FB3A8;--brand-ink:#0C1412;--accent:#E9C46A;--ok:#4CC38A;--bad:#F07167;--shadow:none}}
:root[data-theme="dark"]{--bg:#101614;--surface:#18201D;--ink:#E8EEEB;--ink-2:#9AA8A2;--line:#2A3531;--brand:#5FB3A8;--brand-ink:#0C1412;--accent:#E9C46A;--ok:#4CC38A;--bad:#F07167;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 110px}
header{padding:28px 0 8px}
header h1{margin:0;font-size:30px;letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--ink-2)}
.flag{display:inline-block;width:34px;height:22px;border-radius:4px;vertical-align:-3px;margin-right:8px;background:linear-gradient(90deg,#C4272F 33.3%,#015197 33.3% 66.6%,#C4272F 66.6%)}
nav{position:fixed;left:12px;right:12px;bottom:12px;max-width:560px;margin:0 auto;display:flex;background:var(--surface);border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:5;border:1px solid var(--line)}
nav button{flex:1;padding:14px 4px;font-weight:700;font-size:14px;color:var(--ink-2)}
nav button[aria-current="page"]{color:var(--brand)}
h2{font-size:21px;margin:20px 0 8px}
.muted{color:var(--ink-2)}.small{font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin:10px 0}
.btn{padding:12px 16px;border-radius:14px;font-weight:700;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.row{display:flex;gap:10px;margin-top:12px}.row>*{flex:1}
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.abc button{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 2px;font-size:24px;font-weight:800;line-height:1.1}
.abc button small{display:block;font-size:12px;color:var(--ink-2);font-weight:600;margin-top:3px}
.abc button[aria-pressed="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 14%,var(--surface))}
.big{font-size:56px;font-weight:800;line-height:1}
.mn{font-size:24px;font-weight:800}
.rom{color:var(--brand);font-weight:700}
.list .it{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .it>div{flex:1}
.spk{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.seg button{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.fc{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.fc .en{font-size:30px;font-weight:800}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;margin-top:10px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--surface))}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--brand)}
.stat{display:flex;gap:10px}.stat>div{flex:1;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.stat b{display:block;font-size:22px}
select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.theme{position:absolute;top:18px;right:16px;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
header{position:relative}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:9;max-width:90vw}
</style>
</head>
<body>
<div class="wrap">

  <button class="theme" id="theme" type="button" aria-label="Toggle dark mode">🌓</button>

<main id="main"></main>
</div>
<nav id="nav" aria-label="Sections"></nav>

function vAbc(){

function pool(){return WORDS.filter(function(w){return w.lv===S.lv&&(S.cat==="all"||w.cat===S.cat);});}

function newQ(){

function vQuiz(){
  var r=h("div");filters(r);

    return h("button",{type:"button","aria-pressed":String(S.mode===m[0]),onclick:function(){S.mode=m[0];S.quiz=null;render();}},m[1]);})));
  r.append(h("div",{class:"stat"},h("div",null,h("b",null,S.qok+"/"+S.qn),h("span",{class:"small muted"},"this session")),h("div",null,h("b",null,String(S.best)),h("span",{class:"small muted"},"best streak"))));
  if(!S.quiz)newQ();
  var q=S.quiz,w=q.w,mnMode=S.mode==="mn";
  r.append(h("div",{class:"card",style:"text-align:center;margin-top:12px"},
    mnMode?[h("div",{class:"mn"},w.mn),h("div",{class:"rom"},rom(w.mn)),h("div",{class:"row",style:"justify-content:center"},spk(w.mn))]
      :h("div",{class:"en",style:"font-size:26px;font-weight:800"},w.en)));
  q.o.forEach(function(o){
    var cls="opt";if(q.picked){if(o===w)cls+=" ok";else if(o===q.picked)cls+=" bad";}
    r.append(h("button",{class:cls,type:"button",disabled:!!q.picked,onclick:function(){
      q.picked=o;S.qn++;
      if(o===w){S.qok++;S.run=(S.run||0)+1;if(S.run>S.best){S.best=S.run;sset("best",S.best);}S.box[w.en]=Math.min(4,(S.box[w.en]||0)+1);}
      else{S.run=0;S.box[w.en]=0;}
      sset("box",S.box);if(!mnMode)say(w.mn);render();
    }},mnMode?o.en:[h("b",null,o.mn),h("span",{class:"muted small"}," · "+rom(o.mn))]));
  });
  if(q.picked)r.append(h("button",{class:"btn primary",type:"button",style:"width:100%;margin-top:12px",onclick:function(){newQ();render();}},"Next"));
  return r;
}
function applyTheme(){if(S.theme==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",S.theme);}
document.getElementById("theme").addEventListener("click",function(){S.theme=S.theme==="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark"):"auto";sset("theme",S.theme);applyTheme();});
applyTheme();renderNav();render();
})();
</script>
